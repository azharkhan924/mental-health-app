# =============================================
# Common Configuration (shared across all profiles)
# =============================================
spring.application.name=mental-health

# Active profile: prod profile active by default, overrideable via env var
# Override via env var:  SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# =============================================
# Shared JPA Settings (profile-specific DB
# settings live in application-dev/prod.properties)
# =============================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================
# Shared Server Settings
# =============================================
server.port=${PORT:8080}

# =============================================
# Multi-Provider AI Configuration (with Automatic Key Rotation & Fallback)
# Pass your API keys via environment variables on Render / Production
# =============================================
ai.provider=${AI_PROVIDER:groq}

# Groq Configuration (Ultra-fast inference with multi-key rotation)
ai.groq.keys=${GROQ_API_KEYS:}
ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Gemini Configuration (Fallback provider with multi-key rotation)
ai.gemini.keys=${GEMINI_API_KEYS:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
