spring.application.name=mental-health

# =============================================
# H2 In-Memory Database (for local dev/testing)
# =============================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console at http://localhost:8080/h2-console  (handy for checking tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
# create-drop: creates tables on startup, drops on shutdown (good for dev)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

