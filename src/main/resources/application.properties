# =============================================
# Common Configuration (shared across all profiles)
# =============================================
spring.application.name=mental-health

# Active profile: switch to "prod" on your deployment server
# Override via env var:  SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# =============================================
# Shared JPA Settings (profile-specific DB
# settings live in application-dev/prod.properties)
# =============================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================
# Shared Server Settings
# =============================================
server.port=8080
