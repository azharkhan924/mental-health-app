# =============================================
# DEV Profile — H2 In-Memory Database
# Active when: spring.profiles.active=dev
# =============================================

# --- Datasource ---
spring.datasource.url=jdbc:h2:mem:mental_health_dev
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 Web Console (visit http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop: creates tables fresh on startup, drops them on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show & pretty-print SQL in the console (great for learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.mental_health_app=DEBUG
