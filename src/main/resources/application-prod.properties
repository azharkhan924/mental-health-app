# =============================================
# PROD Profile — PostgreSQL (Render / Production)
# Active when: SPRING_PROFILES_ACTIVE=prod
# =============================================

# --- Datasource (Render PostgreSQL Support) ---
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/mental_health_db}}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:changeme}}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# --- H2 Console (DISABLED in production) ---
spring.h2.console.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hide raw SQL logs in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logging ---
logging.level.org.hibernate.SQL=WARN
logging.level.com.mental_health_app=INFO

# --- Actuator Health Check for Render zero-downtime monitoring ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
