# =============================================
# PROD Profile — PostgreSQL (Render / Production)
# Active when: SPRING_PROFILES_ACTIVE=prod
# =============================================

# --- H2 Console (DISABLED in production) ---
spring.h2.console.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hide raw SQL logs in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logging ---
logging.level.org.hibernate.SQL=WARN
logging.level.com.mental_health_app=INFO

# --- Actuator Health Check for Render zero-downtime monitoring ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
