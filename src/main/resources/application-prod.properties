# =============================================
# PROD Profile — PostgreSQL
# Active when: SPRING_PROFILES_ACTIVE=prod
# =============================================

# --- Datasource ---
# Use environment variables — never hardcode credentials in source code!
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mental_health_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# Connection pool (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# --- H2 Console (DISABLED in production — security risk) ---
spring.h2.console.enabled=false

# --- JPA / Hibernate ---
# update: adds new columns/tables but NEVER drops existing ones (safe for prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hide SQL from logs in production (performance + security)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logging (minimal in prod) ---
logging.level.org.hibernate.SQL=WARN
logging.level.com.mental_health_app=INFO

# --- Security hardening ---
# Expose only health check endpoint on actuator (not all internals)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
